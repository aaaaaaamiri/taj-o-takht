<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRAN ROAD 3D</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: Tahoma, sans-serif;
  background: #87ceeb;
}

#game {
  width: 100vw;
  height: 100vh;
}

#hud {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 10;
  color: white;
  background: #101820dd;
  padding: 15px;
  border-radius: 12px;
}

#controls {
  position: fixed;
  bottom: 25px;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 20px;
  z-index: 10;
}

button {
  border: none;
  border-radius: 15px;
  background: #182b3b;
  color: white;
  padding: 20px;
  font-size: 18px;
  touch-action: none;
}

button:active {
  background: orange;
}

</style>
</head>

<body>

<div id="hud">
  🚛 IRAN ROAD 3D
  <br><br>
  سرعت: <span id="speed">0</span> KM/H
</div>

<div id="game"></div>

<div id="controls">
  <div>
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>

  <div>
    <button id="brake">ترمز</button>
    <button id="gas">گاز</button>
  </div>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

document.getElementById("game")
.appendChild(renderer.domElement);

// نورپردازی

const light = new THREE.DirectionalLight(
  0xffffff,
  2
);

light.position.set(10,20,10);
scene.add(light);

scene.add(
  new THREE.AmbientLight(0xffffff,1)
);

// زمین

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),
  new THREE.MeshStandardMaterial({
    color: 0x527b42
  })
);

ground.rotation.x = -Math.PI/2;
ground.position.y = -0.2;
scene.add(ground);

// جاده

const road = new THREE.Mesh(
  new THREE.BoxGeometry(12,0.2,500),
  new THREE.MeshStandardMaterial({
    color: 0x333333
  })
);

road.position.z = -180;
scene.add(road);

// خطوط وسط جاده

for(let i=0;i<40;i++){

  const line = new THREE.Mesh(
    new THREE.BoxGeometry(0.2,0.03,4),
    new THREE.MeshBasicMaterial({
      color: 0xffffff
    })
  );

  line.position.set(0,0.12,-i*12);

  scene.add(line);
}

// کامیون

const truck = new THREE.Group();

// تریلر

const trailer = new THREE.Mesh(
  new THREE.BoxGeometry(2.8,3,7),
  new THREE.MeshStandardMaterial({
    color: 0xffffff
  })
);

trailer.position.set(0,2,-1);
truck.add(trailer);

// کابین

const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(2.7,2.6,2.5),
  new THREE.MeshStandardMaterial({
    color: 0x174e85
  })
);

cabin.position.set(0,1.8,3.7);
truck.add(cabin);

// چرخ ها

for(let x of [-1.5,1.5]){

  for(let z of [-3,-1,2.5,4]){

    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.5,0.5,0.35,24
      ),
      new THREE.MeshStandardMaterial({
        color: 0x111111
      })
    );

    wheel.rotation.z = Math.PI/2;
    wheel.position.set(x,0.55,z);

    truck.add(wheel);
  }
}

truck.position.z = 5;
scene.add(truck);

// دوربین

camera.position.set(0,6,14);
camera.lookAt(0,1,0);

// کنترل

let speed = 0;

let gas = false;
let brake = false;
let left = false;
let right = false;

function control(id,variable){

  const btn = document.getElementById(id);

  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    window[variable] = true;
  });

  ["pointerup","pointercancel","pointerleave"].forEach(event=>{
    btn.addEventListener(event,()=>{
      window[variable] = false;
    });
  });
}

control("gas","gas");
control("brake","brake");
control("left","left");
control("right","right");

// کیبورد

window.addEventListener("keydown",e=>{

  if(e.key==="ArrowUp" || e.key==="w") gas=true;
  if(e.key==="ArrowDown" || e.key==="s") brake=true;
  if(e.key==="ArrowLeft" || e.key==="a") left=true;
  if(e.key==="ArrowRight" || e.key==="d") right=true;

});

window.addEventListener("keyup",e=>{

  if(e.key==="ArrowUp" || e.key==="w") gas=false;
  if(e.key==="ArrowDown" || e.key==="s") brake=false;
  if(e.key==="ArrowLeft" || e.key==="a") left=false;
  if(e.key==="ArrowRight" || e.key==="d") right=false;

});

// حلقه بازی

function animate(){

  requestAnimationFrame(animate);

  if(gas) speed += 0.12;
  if(brake) speed -= 0.3;

  speed *= 0.995;

  speed = Math.max(0,Math.min(speed,120));

  if(left) truck.position.x += 0.08;
  if(right) truck.position.x -= 0.08;

  truck.position.x = THREE.MathUtils.clamp(
    truck.position.x,-4,4
  );

  document.getElementById("speed").innerText =
  Math.floor(speed);

  camera.position.x = truck.position.x;

  camera.lookAt(
    truck.position.x,
    1,
    -5
  );

  renderer.render(scene,camera);

}

animate();

// تغییر اندازه صفحه

window.addEventListener("resize",()=>{

  camera.aspect =
  window.innerWidth/window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

</body>
</html>
