
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تاج و تخت</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101923;color:#edf2f7;font-family:Tahoma,Arial}
header{padding:14px;background:#172432;border-bottom:1px solid #405164}
.brand{font-size:23px;color:#e7bd62;font-weight:bold}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat,.panel{background:#202f3e;border:1px solid #405164;border-radius:9px;padding:9px}
.stat b{color:#f1c66d}
main{display:grid;grid-template-columns:210px 1fr 230px;gap:10px;padding:10px;max-width:1400px;margin:auto}
.panel{padding:0;overflow:hidden}
.panel h3{margin:0;padding:12px;color:#e7bd62;border-bottom:1px solid #405164;font-size:14px}
.inside{padding:10px}
.mapbox{background:#173447;border:1px solid #486174;border-radius:10px;overflow:hidden}
svg{width:100%;height:auto;display:block}
.land{stroke:#8ca0af;stroke-width:2;cursor:pointer}
.land:hover{stroke:white;stroke-width:4}
.sel{stroke:#fff1a8;stroke-width:5}
.label{fill:white;font:bold 11px Tahoma;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#182531;stroke-width:3px}
.army{fill:#ffda8a;font:10px Tahoma;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#182531;stroke-width:3px}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;padding:9px;background:#172432}
button{padding:11px 5px;border:1px solid #64798d;border-radius:8px;background:#2d4357;color:white;font:12px Tahoma;cursor:pointer}
button:disabled{opacity:.35}
.primary{background:#80602c}
.rank{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #354657;font-size:12px}
.detail{line-height:2;font-size:12px}
.gold{color:#e7bd62}
.log{font-size:11px;line-height:1.8;max-height:170px;overflow:auto}
.log div{border-bottom:1px solid #354657;padding:4px}
footer{text-align:center;color:#8293a3;font-size:10px;padding:15px}
@media(max-width:850px){
main{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
<div class="brand">♛ تاج و تخت</div>
<small>جهان خیالی آریون</small>
<div class="stats">
<div class="stat">🪙 خزانه <b id="gold">۱۲۰۰</b></div>
<div class="stat">👥 جمعیت <b id="pop">۸۴۰۰۰</b></div>
<div class="stat">⚔ ارتش <b id="army">۸۵۰</b></div>
<div class="stat">📈 درآمد <b id="income">+۸۵</b></div>
<div class="stat">⏱ دور <b id="turn">۱</b></div>
</div>
</header>

<main>

<aside class="panel">
<h3>🏆 قدرت‌های برتر</h3>
<div class="inside" id="ranking"></div>
<h3>📜 گزارش‌های جهان</h3>
<div class="inside log" id="log"></div>
</aside>

<section>
<div class="mapbox">
<svg viewBox="0 0 900 570">
<rect width="900" height="570" fill="#173447"/>
<text x="450" y="290" fill="#79a2b7" text-anchor="middle">دریای میانی</text>
<g id="territories"></g>
</svg>
</div>

<div class="actions">
<button class="primary" id="attack">⚔️ حمله</button>
<button id="recruit">🛡️ سربازگیری</button>
<button id="fort">🏰 ساخت دژ</button>
<button id="end">⏭️ پایان دور</button>
</div>
</section>

<aside class="panel">
<h3>🗺️ اطلاعات سرزمین</h3>
<div class="inside detail" id="details">یک سرزمین را انتخاب کن.</div>
<h3>🎯 کشور من</h3>
<div class="inside detail" id="mine"></div>
</aside>

</main>

<footer>تاج و تخت | نسخه ۰.۱</footer>

<script>
const names=[
"آریانا","والور","زارون","نهال","الدور",
"مارون","تارگوس","سرین","کالدار","وسترا",
"ارمان","دالیا","رهام","نکسار","آستور",
"برکان","لوریان","ساهل","وردان","کایروس",
"مهران","الترا","نارون","فرهاد","سولان",
"دمورا","آوستا","رادمان","تیرا","گالن"
];

const positions=[
[90,80],[205,62],[320,88],[430,60],[550,88],
[675,72],[790,110],[55,205],[175,190],[290,210],
[410,185],[535,205],[655,190],[790,225],[100,340],
[220,325],[340,350],[455,325],[570,350],[700,330],
[820,365],[65,470],[190,465],[310,485],[435,465],
[555,485],[675,465],[800,490],[385,115],[520,120]
];

const colors=[
"#a34d4d","#477b9b","#98713d","#63865a",
"#8064a4","#b06c87","#4f8a83","#a28b4c"
];

let states=names.map((name,i)=>({
name,
x:positions[i][0],
y:positions[i][1],
army:i===0?850:300+(i*173)%900,
pop:12000+(i*3901)%25000,
owner:i===0,
fort:0,
color:i===0?"#bd8a3f":colors[i%8]
}));

let selected=0;
let gold=1200;
let turn=1;

const ns="http://www.w3.org/2000/svg";

function shape(c,i){
let points=[];
for(let k=0;k<8;k++){
let angle=k*Math.PI/4+i*.17;
let r=43+(i*13+k*17)%19;
points.push(
(c.x+Math.cos(angle)*r)+","+
(c.y+Math.sin(angle)*r*.72)
);
}
return points.join(" ");
}

function fmt(n){
return n.toLocaleString("fa-IR");
}

function log(message){
let d=document.createElement("div");
d.textContent="دور "+fmt(turn)+": "+message;
document.querySelector("#log").prepend(d);
}

function draw(){
let g=document.querySelector("#territories");
g.innerHTML="";

states.forEach((c,i)=>{
let p=document.createElementNS(ns,"polygon");
p.setAttribute("points",shape(c,i));
p.setAttribute("fill",c.owner?"#bd8a3f":c.color);
p.setAttribute("class","land"+(i===selected?" sel":""));
p.onclick=()=>{
selected=i;
draw();
};
g.append(p);

let t=document.createElementNS(ns,"text");
t.setAttribute("x",c.x);
t.setAttribute("y",c.y-2);
t.setAttribute("class","label");
t.textContent=c.name;
g.append(t);

let a=document.createElementNS(ns,"text");
a.setAttribute("x",c.x);
a.setAttribute("y",c.y+14);
a.setAttribute("class","army");
a.textContent="⚔ "+fmt(c.army);
g.append(a);
});

let c=states[selected];
let own=states.filter(x=>x.owner);
let total=own.reduce((s,x)=>s+x.army,0);

document.querySelector("#details").innerHTML=
'<b class="gold">'+c.name+'</b>'+
(c.owner?' 👑 سرزمین شما':' · مستقل')+
'<br>جمعیت: '+fmt(c.pop)+
'<br>ارتش: '+fmt(c.army)+
'<br>دژ دفاعی: '+fmt(c.fort);

document.querySelector("#mine").innerHTML=
'کشور اصلی: <b class="gold">آریانا</b>'+
'<br>سرزمین‌های تحت کنترل: '+fmt(own.length)+'/۳۰'+
'<br>درآمد هر دور: +'+fmt(own.length*85);

document.querySelector("#ranking").innerHTML=
[...states].sort((a,b)=>b.army-a.army)
.slice(0,7).map((c,i)=>
'<div class="rank"><span>'+fmt(i+1)+
'. '+c.name+(c.owner?' 👑':'')+
'</span><span>'+fmt(c.army)+' ⚔</span></div>'
).join("");

document.querySelector("#gold").textContent=fmt(gold);
document.querySelector("#pop").textContent=
fmt(own.reduce((s,x)=>s+x.pop,0));
document.querySelector("#army").textContent=fmt(total);
document.querySelector("#income").textContent="+"+fmt(own.length*85);
document.querySelector("#turn").textContent=fmt(turn);

document.querySelector("#attack").disabled=
c.owner||total<=c.army;
}

document.querySelector("#recruit").onclick=()=>{
if(gold<150){
log("سکه کافی برای سربازگیری نداری.");
return;
}
gold-=150;
states[0].army+=120;
log("۱۲۰ سرباز به ارتش آریانا پیوستند.");
draw();
};

document.querySelector("#fort").onclick=()=>{
let c=states[selected];
if(!c.owner){
log("فقط در سرزمین خودت می‌توانی دژ بسازی.");
return;
}
if(gold<300){
log("ساخت دژ ۳۰۰ سکه هزینه دارد.");
return;
}
gold-=300;
c.fort++;
log("در "+c.name+" دژ ساخته شد.");
draw();
};

document.querySelector("#attack").onclick=()=>{
let target=states[selected];
let total=states.filter(x=>x.owner)
.reduce((s,x)=>s+x.army,0);
let force=Math.floor(total*.55);

if(target.owner||total<=target.army)return;

if(force>target.army+100){
target.owner=true;
target.army=Math.max(100,force-target.army);
gold+=180;
log("پیروزی! "+target.name+" تصرف شد.");
}else{
states[0].army=Math.max(
100,states[0].army-Math.floor(force*.35)
);
log("حمله به "+target.name+" شکست خورد.");
}
draw();
};

document.querySelector("#end").onclick=()=>{
turn++;
let own=states.filter(x=>x.owner);
gold+=own.length*85;

own.forEach(c=>{
c.army+=12+Math.floor(c.pop/5000);
});

states.filter(x=>!x.owner).forEach(c=>{
if(Math.random()<.12)c.army+=30;
});

log("درآمد دریافت شد و ارتش‌ها تقویت شدند.");

if(own.length===30){
log("پیروزی نهایی! تمام سرزمین‌ها متحد شدند.");
}
draw();
};

log("فرمانروایی آریانا آغاز شد.");
draw();
</script>
</body>
</html>
